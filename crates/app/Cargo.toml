[package]
name = "factory-app"
description = "The factory binary: the command line, with engine, window and sockets in one process."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "factory"
path = "src/main.rs"

[features]
faults = ["factory-engine/faults"]

[dependencies]
factory-types.workspace = true
factory-core.workspace = true
factory-engine.workspace = true
factory-ui.workspace = true
factory-sys.workspace = true
iced.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
factory-fakes.workspace = true
serde_json.workspace = true

[lints]
workspace = true
