# Copy to ~/.config/mork/mork.toml and adjust paths for your machine.

[mork]
# Optional: set `project = "mork"` only if you are developing Mork itself
# (enables self-rebuilds and two-phase wall verification on Mork's own repo).

# Model requests and login refresh for Claude Code and Codex with ChatGPT sign-in.
domains = ["api.anthropic.com", "platform.claude.com", "chatgpt.com", "auth.openai.com"]

# Bound read-only into every sandbox wall; each `bin` joins PATH in order.
toolchains = [
  { path = "/usr/local", bin = "bin" },
  { path = "/home/you/.rustup" },
  { path = "/home/you/.cargo/bin", bin = "." },
]
# Optional download caches shared read-write across private per-seat homes.
caches = [".cargo/registry", ".npm/_cacache"]
cache_files = [".cargo/.package-cache", ".cargo/.package-cache-mutate"]
env = { RUSTUP_HOME = "/home/you/.rustup" }
context_cap = 400000
fresh_context_percent = 70
max_test_runs = 4
web_port = 41900
web_assets = "/path/to/mork/web/dist"

[git]
author = "Your Name <you@example.com>"

# The planner and reviewers use Codex. The work foreman uses Claude.
[seats.planner]
cli = "codex"
model = "gpt-6.2-sol"
effort = "high"

[seats.foreman]
report = { cli = "codex", model = "gpt-6.2-sol", effort = "high" }
work = { cli = "claude", model = "claude-sonnet-5-5", effort = "high" }

[seats.researcher]
work = { cli = "codex", model = "gpt-6.2-sol", effort = "high" }

[seats.review-foreman]
work = { cli = "claude", model = "claude-opus-5-5", effort = "high" }
inside = { cli = "claude", model = "claude-opus-5-5", effort = "high" }
outside = { cli = "claude", model = "claude-opus-5-5", effort = "high" }

[seats.reviewer]
work = { cli = "codex", model = "gpt-6.2-sol", effort = "high" }
inside = { cli = "codex", model = "gpt-6.2-sol", effort = "high" }
outside = { cli = "codex", model = "gpt-6.2-sol", effort = "high" }

[projects.my-app]
repo = "/path/to/my-app"
base = "main"
board = { kind = "markdown", path = "/path/to/my-app-board" }
forge = { kind = "local" }
# npm and Cargo registries for this project's builds.
domains = ["registry.npmjs.org", "index.crates.io", "static.crates.io"]
slots = 3
test = "cargo test"
# Optional:
# checks = { command = "cargo clippy -- -D warnings", folder = "/path/to/my-app" }
# install = "npm ci"
# preview = "PORT=$MORK_PORT npm run dev"
