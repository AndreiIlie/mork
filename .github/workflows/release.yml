name: Linux release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  BUNDLE: mork-${{ github.ref_name }}-linux-x86_64

jobs:
  build:
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Linux binary and dashboard
        env:
          MORK_BUILD_COMMIT: ${{ github.sha }}
        run: |
          cargo xtask web
          cargo build --locked --release -p mork-app

      - name: Package Linux archive
        run: |
          mkdir -p "$BUNDLE/web"
          cp target/release/mork mork.example.toml "$BUNDLE/"
          cp -R web/dist "$BUNDLE/web/"
          tar -czf "$BUNDLE.tar.gz" "$BUNDLE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.BUNDLE }}.tar.gz
          path: ${{ env.BUNDLE }}.tar.gz
          archive: false
          if-no-files-found: error
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.BUNDLE }}.tar.gz
          path: ${{ runner.temp }}/release
          skip-decompress: true

      - name: Publish archive to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/release/$BUNDLE.tar.gz"
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft'); then
            gh release upload "$GITHUB_REF_NAME" "$archive" --clobber
            if [[ "$draft" == true ]]; then
              gh release edit "$GITHUB_REF_NAME" --draft=false
            fi
          else
            # The tag annotation carries supported upgrade versions and fresh-start guidance.
            gh release create "$GITHUB_REF_NAME" "$archive" --verify-tag --notes-from-tag
          fi
